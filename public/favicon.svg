<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#accentGrad)" stroke-width="12" opacity="0.6"/>

  <!-- Mechanical Gear Accents -->
  <g transform="translate(256, 256)" opacity="0.15">
    <circle r="180" fill="none" stroke="#ffffff" stroke-width="24" stroke-dasharray="30 20"/>
    <circle r="130" fill="none" stroke="#ffffff" stroke-width="12"/>
  </g>

  <!-- Monogram AS Text -->
  <text x="256" y="325" font-family="'Manrope', 'Bricolage Grotesque', system-ui, sans-serif" font-weight="900" font-size="210" fill="#ffffff" text-anchor="middle" letter-spacing="-6">AS</text>

  <!-- Accent Gear Dot -->
  <circle cx="390" cy="140" r="24" fill="url(#accentGrad)"/>
</svg>
